# Cloud Run multi-container service: app + litestream sidecar on a shared
# emptyDir volume. Single writer (--max-instances=1) because Litestream
# replicas are append-only per source file.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pixel-plot
  namespace: "334525373884"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: "gen1"
    spec:
      serviceAccountName: "334525373884-compute@developer.gserviceaccount.com"
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/pixel-plot-2026/pixel-plot/app:latest
          command:
            - /bin/sh
          args:
            - -c
            - |
              until [ -f /data/.restored ]; do sleep 0.3; done
              exec node build
          env:
            - name: PIXEL_DB
              value: /data/pixel.db
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: litestream
          image: litestream/litestream:0.5
          command:
            - /bin/sh
          args:
            - -c
            - |
              cat > /tmp/litestream.yml <<'EOF'
              dbs:
                - path: /data/pixel.db
                  replicas:
                    - url: gs://pixel-plot-2026-litestream/pixel.db
              EOF
              litestream restore -if-replica-exists -config /tmp/litestream.yml /data/pixel.db
              touch /data/.restored
              exec litestream replicate -config /tmp/litestream.yml
          resources:
            limits:
              cpu: "0.5"
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
